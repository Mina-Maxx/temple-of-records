services:
  - type: web
    name: temple-of-records
    runtime: node
    plan: free
    buildCommand: "echo 'No build step required'"
    startCommand: "node server/server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TOR_HTTPS
        value: "1"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
