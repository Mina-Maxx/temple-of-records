# /etc/nginx/sites-available/temple  (replace YOUR_DOMAIN, then: ln -s to sites-enabled)
# Get the certificate first:  sudo certbot certonly --nginx -d YOUR_DOMAIN
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    client_max_body_size 5m;            # media upload limit is 4 MB

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # OVERWRITE (never append) so clients cannot spoof their IP:
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
