<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المعبد — الإعدادات</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<script src="app.js"></script>
<script>
(function(){
var A=window.TORADMIN;
A.boot().then(function(ok){
 if(!ok)return;
 A.shell('settings','<b>'+A.t('nSettings')+'</b>',function(c){
  var ar=A.lang()==='ar';
  A.api('/admin/api/content').then(function(j){
   var fields=j.fixedFields||[],vals=j.fixed||{};
   var groups={};fields.forEach(function(f){(groups[f.group]=groups[f.group]||[]).push(f)});
   var changed={};
   var html='<div class="page-head"><div class="page-head-main"><h1>'+A.t('nSettings')+'</h1><span class="sub">'+(ar?'الهوية والمظهر وSEO ونصوص الواجهة الثابتة وكلمة المرور.':'Site identity, SEO tags, localized fixed copy, and password management.')+'</span></div></div>'+
   '<div class="jump-sticky"><nav class="jump" aria-label="Settings sections">'+
    '<a href="#site-config">'+(ar?'الهوية والمظهر':'Identity & appearance')+'</a>'+
    '<a href="#seo-section">SEO</a>'+
    '<a href="#fixed-texts">'+(ar?'النصوص الثابتة':'Fixed texts')+'</a>'+
    '<a href="#pw-section">'+(ar?'الأمان وكلمة المرور':'Security & password')+'</a>'+
   '</nav></div>';

   var configFields=[['name_ar','اسم الموقع (عربي)','Website name AR'],['name_en','اسم الموقع (إنجليزي)','Website name EN'],['description_ar','وصف الموقع (عربي)','Website description AR'],['description_en','وصف الموقع (إنجليزي)','Website description EN'],['logo','مسار الشعار','Logo path'],['favicon','مسار الأيقونة','Favicon path'],['social_image','صورة المشاركة','Social sharing image'],['other_link','رابط آخر https','Other link https'],['base_url','نطاق الموقع https للـ sitemap','Site origin https (for sitemap)'],['gold','اللون الذهبي #HEX','Gold accent #HEX']];
   html+='<section class="panel" id="site-config"><h2>'+(ar?'إعدادات الهوية والمظهر':'Identity and appearance')+'</h2><p class="sub">'+(ar?'الروابط الخارجية لا تُفحص تلقائيًا. RTL يتبع اللغة تلقائيًا.':'External links are not verified automatically. RTL follows the selected language.')+'</p>'+
    '<div class="row2">'+configFields.map(function(f){return '<div class="field'+(/_ar$/.test(f[0])?' ar-only':'')+'"><label>'+A.esc(ar?f[1]:f[2])+'</label><input class="input'+(/^(logo|favicon|social_image|other_link|base_url|gold)$/.test(f[0])?' mono':'')+'"'+(/_ar$/.test(f[0])?'':' dir="ltr"')+' data-cfg="'+f[0]+'"></div>'}).join('')+'</div>'+
    '<div class="field mt-2"><label class="check"><input type="checkbox" data-cfg="arabic_enabled" id="cfg-arabic-enabled"> <span>'+(ar?'تفعيل الموقع العربي (Enable Arabic site)':'Enable Arabic site')+'</span></label><p class="hint">When OFF, the public site serves English only while retaining your stored Arabic copy safely.</p></div>'+
    '<div class="row3">'+
     '<div class="field"><label for="cfg-default-lang">'+(ar?'اللغة الافتراضية':'Default language')+'</label><select class="input" data-cfg="default_language" id="cfg-default-lang"><option value="en">English</option><option value="ar">العربية</option></select></div>'+
     '<div class="field"><label for="cfg-mode">'+(ar?'المظهر':'Appearance')+'</label><select class="input" id="cfg-mode" data-cfg="mode"><option value="dark">Dark</option><option value="light">Light</option></select></div>'+
     '<div class="field ar-only"><label for="cfg-font">'+(ar?'خط النص العربي':'Arabic body font')+'</label><select class="input" id="cfg-font" data-cfg="font_ar"><option>IBM Plex Sans Arabic</option><option>Tajawal</option></select></div>'+
    '</div><button type="button" class="btn primary" id="cfg-save">'+A.t('save')+'</button></section>';

   html+='<section class="panel" id="seo-section"><h2>SEO</h2><p class="sub">'+(ar?'وصف ميتا وكلمات مفتاحية — تُحفظ في ملف seo.json وتُحقن ديناميكيًا عند العرض بدون تعديل ملفات الكود.':'Meta description and keywords — stored in TOR_DATA_DIR/seo.json and injected dynamically per response.')+'</p>'+
    '<div class="frow"><div class="fcol ar-only"><label for="seo-ar">'+(ar?'الوصف (عربي)':'Description (Arabic)')+'</label><textarea class="input" id="seo-ar" rows="2" maxlength="300"></textarea></div>'+
    '<div class="fcol"><label for="seo-en">'+(ar?'الوصف (إنجليزي)':'Description (English)')+'</label><textarea class="input" id="seo-en" rows="2" maxlength="300" dir="ltr"></textarea></div></div>'+
    '<div class="frow"><div class="fcol ar-only"><label for="seo-ar-kw">'+(ar?'كلمات مفتاحية (عربي)':'Keywords (Arabic)')+'</label><input class="input" id="seo-ar-kw" maxlength="300"></div>'+
    '<div class="fcol"><label for="seo-en-kw">'+(ar?'كلمات مفتاحية (إنجليزي)':'Keywords (English)')+'</label><input class="input" id="seo-en-kw" maxlength="300" dir="ltr"></div></div>'+
    '<div class="inline-acts mt-2"><button type="button" class="btn primary sm" id="seo-save">'+A.t('save')+'</button><span class="small dim" id="seo-note"></span></div></section>';

   html+='<div id="fixed-texts">';
   Object.keys(groups).forEach(function(g){
    html+='<section class="panel"><h2>'+A.esc(g)+'</h2>';
    groups[g].forEach(function(f){
     var base=f.page+'-',sfx=':'+f.key;
     html+='<div class="field"><label>'+A.esc(f.label||f.key)+'</label><div class="row2">'+
      '<input class="input ar-only" data-k="'+base+'ar'+sfx+'" value="'+A.esc(vals[base+'ar'+sfx]||'')+'" placeholder="العربية">'+
      '<input class="input" dir="ltr" data-k="'+base+'en'+sfx+'" value="'+A.esc(vals[base+'en'+sfx]||'')+'" placeholder="English">'+
     '</div></div>';
    });
    html+='</section>';
   });
   html+='</div>';
   html+='<div class="savebar" id="savebar"><span class="small" id="chgcount"></span><span style="flex:1"></span><button type="button" class="btn ghost" id="revert">'+A.t('cancel')+'</button><button type="button" class="btn primary" id="saveall">'+A.t('save')+'</button></div>';

   html+='<section class="panel" id="pw-section"><h2>'+(ar?'تغيير كلمة المرور':'Change password')+'</h2><p class="sub">'+(ar?'يشترط كلمة المرور الحالية. تنتهي جميع الجلسات بعد التغيير.':'Requires current password. All active sessions end immediately upon change.')+'</p>'+
    '<div class="row3">'+
     '<div class="field"><label for="pw-current">'+(ar?'الحالية':'Current')+'</label><input class="input" type="password" id="pw-current" autocomplete="current-password"></div>'+
     '<div class="field"><label for="pw-new">'+(ar?'الجديدة (١٠ أحرف+)':'New (10+ chars)')+'</label><input class="input" type="password" id="pw-new" autocomplete="new-password"></div>'+
     '<div class="field"><label for="pw-confirm">'+(ar?'تأكيد الجديدة':'Confirm new')+'</label><input class="input" type="password" id="pw-confirm" autocomplete="new-password"></div>'+
    '</div><button type="button" class="btn danger" id="pw-save">'+(ar?'تغيير كلمة المرور':'Change password')+'</button></section>';

   c.innerHTML=html;
   var wasArabic=false;
   function syncArabicUi(){var chk=document.getElementById('cfg-arabic-enabled'),dl=document.getElementById('cfg-default-lang');if(chk&&dl){dl.disabled=!chk.checked;dl.style.opacity=chk.checked?'1':'0.5'}}
   A.api('/admin/api/site-settings').then(function(r){
    var o=r.settings||{};wasArabic=o.arabic_enabled===true;
    c.querySelectorAll('[data-cfg]').forEach(function(i){if(i.type==='checkbox'){i.checked=o[i.dataset.cfg]===true}else if(o[i.dataset.cfg]!=null)i.value=o[i.dataset.cfg]});
    if(!o.gold)c.querySelector('[data-cfg=gold]').value='#D7B776';
    syncArabicUi();
   });
   document.getElementById('cfg-arabic-enabled').onchange=syncArabicUi;
   document.getElementById('cfg-save').onclick=function(){
    var o={};c.querySelectorAll('[data-cfg]').forEach(function(i){o[i.dataset.cfg]=i.type==='checkbox'?!!i.checked:i.value});
    function doSave(done){A.api('/admin/api/site-settings',{method:'PUT',body:o}).then(function(r){if(done)done();if(r._code===200){wasArabic=o.arabic_enabled;document.body.classList.toggle('en-only',!wasArabic);A.toast(A.t('saved'),'ok');setTimeout(function(){location.reload()},350)}else A.toast(r.error||A.t('failed'),'err')})}
    if(wasArabic&&!o.arabic_enabled){
     A.modal({title:ar?'تعطيل الموقع العربي؟':'Disable Arabic site?',body:'When OFF, the public site serves English only while retaining your stored Arabic copy safely.',confirmLabel:A.t('save'),onConfirm:doSave});
    }else doSave();
   };
   document.getElementById('pw-save').onclick=function(){
    var pass=document.getElementById('pw-new').value;
    if(pass!==document.getElementById('pw-confirm').value||pass.length<10){A.toast(ar?'تأكد من تطابق الكلمتين وطولهما':'Check matching passwords and length','err');return}
    A.modal({title:ar?'تغيير كلمة المرور؟':'Change password?',body:ar?'ستنتهي جميع الجلسات.':'All sessions will end.',danger:true,onConfirm:function(done){
     A.api('/admin/api/password',{method:'PUT',body:{current:document.getElementById('pw-current').value,password:pass}}).then(function(r){done();if(r._code===200)location.replace('login.html');else A.toast(r.error||A.t('failed'),'err')});
    }});
   };
   var bar=document.getElementById('savebar');
   function refresh(){var n=Object.keys(changed).length;bar.className='savebar'+(n?' on':'');document.getElementById('chgcount').textContent=n?(ar?n+' حقل معدّل':n+' field(s) changed'):''}
   c.querySelectorAll('[data-k]').forEach(function(inp){
    inp.addEventListener('input',function(){
     var k=inp.dataset.k;
     if(inp.value===(vals[k]||'')){delete changed[k];inp.classList.remove('dirty')}else{changed[k]=inp.value;inp.classList.add('dirty')}
     refresh();
    });
   });
   document.getElementById('revert').onclick=function(){location.reload()};
   A.api('/admin/api/seo').then(function(r){
    if(r._code===200&&r.seo){
     document.getElementById('seo-ar').value=(r.seo.ar||{}).description||'';
     document.getElementById('seo-en').value=(r.seo.en||{}).description||'';
     document.getElementById('seo-ar-kw').value=(r.seo.ar||{}).keywords||'';
     document.getElementById('seo-en-kw').value=(r.seo.en||{}).keywords||'';
    }
   }).catch(function(){});
   document.getElementById('seo-save').onclick=function(){
    A.api('/admin/api/seo',{method:'PUT',body:{ar:{description:document.getElementById('seo-ar').value,keywords:document.getElementById('seo-ar-kw').value},en:{description:document.getElementById('seo-en').value,keywords:document.getElementById('seo-en-kw').value}}}).then(function(r){
     if(r._code===200){A.toast(A.t('saved')+' — SEO ('+r.pages+' '+(ar?'صفحات':'pages')+')','ok');document.getElementById('seo-note').textContent=(ar?'يُطبّق على ':'Applied across ')+r.pages+(ar?' صفحات عامة':' public routes')}
     else A.toast(r.error||A.t('failed'),'err');
    }).catch(function(){A.toast(A.t('errNet'),'err')});
   };
   document.getElementById('saveall').onclick=function(){
    A.api('/admin/api/content/fixed',{method:'PUT',body:{values:changed}}).then(function(r){
     if(r._code===200){A.toast(A.t('saved')+' ('+r.count+')','ok');Object.assign(vals,changed);for(var k in changed)delete changed[k];c.querySelectorAll('.dirty').forEach(function(x){x.classList.remove('dirty')});refresh()}
     else A.toast(r.error||A.t('failed'),'err');
    }).catch(function(){A.toast(A.t('errNet'),'err')});
   };
  }).catch(function(){c.innerHTML='<div class="empty"><h3>'+A.t('errNet')+'</h3></div>'});
 });
});
})();
</script>
</body>
</html>
