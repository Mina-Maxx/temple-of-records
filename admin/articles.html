<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المعبد — الرايتبس</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel+Decorative:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<script src="app.js"></script>
<script>
(function(){
var A=window.TORADMIN;
A.boot().then(function(ok){
 if(!ok)return;
 A.shell('articles','<b>'+A.t('nArticles')+'</b>',function(c){
  var ar=A.lang()==='ar';
  A.api('/admin/api/content').then(function(j){
   var items=(j.collections.articles||[]).slice();
   var q='',PAGE=25,page=0;
   function paint(){
   var filtered=items.filter(function(it){
    if(!q)return true;
    var hay=((it.title_ar||'')+' '+(it.title_en||'')+' '+it.id+' '+(it.tags||[]).join(' ')).toLowerCase();
    return hay.indexOf(q)!==-1;
   });
   var pages=Math.max(1,Math.ceil(filtered.length/PAGE));if(page>=pages)page=pages-1;
   var view=filtered.slice(page*PAGE,(page+1)*PAGE);
   c.innerHTML='<div class="page-head"><h1>'+A.t('nArticles')+'</h1><span class="sub">'+A.t('sampleData')+'</span>'+
   '<div class="acts"><a class="btn primary" href="article-edit.html">'+A.icon('doc',15)+A.t('create')+'</a></div></div>'+
   '<div class="frow" style="margin-bottom:12px"><input class="input searchbar" id="q" placeholder="'+A.t('search')+'" value="'+A.esc(q)+'"><span class="small dim">'+view.length+' / '+items.length+'</span></div>'+
   '<div class="panel" style="padding:0;overflow:hidden">'+
   (view.length?'<div class="tbl-wrap" style="border:0"><table class="tbl"><thead><tr><th>'+A.t('thTitle')+'</th><th>'+A.t('thStatus')+'</th><th>'+(ar?'اللغة':'Language')+'</th><th>'+(ar?'الفئة':'Category')+'</th><th>'+(ar?'تاريخ النشر':'Publication date')+'</th><th>'+(ar?'آخر تعديل':'Updated')+'</th><th>'+(ar?'الوسوم':'Tags')+'</th><th>'+(ar?'معاينة':'Preview')+'</th></tr></thead><tbody>'+
    view.map(function(it){
     var title=ar?(it.title_ar||it.title_en):(it.title_en||it.title_ar);
     return '<tr><td><div class="t-main">'+A.esc(title||it.id)+'</div><div class="t-sub mono">'+A.esc(it.id)+'</div></td>'+
     '<td>'+((it.hidden||it.status==='archived')?A.badge(A.t('stArch'),'dim'):it.status==='draft'?A.badge(ar?'مسودة':'Draft','info'):it.sample?A.badge(A.t('stDemo'),'warn'):(it.available?A.badge(A.t('stAvail'),'ok'):A.badge(A.t('stPrep'),'info')))+'</td>'+
     '<td class="mono small">'+((it.title_ar?'AR ':'')+(it.title_en?'EN':''))+'</td><td>'+A.esc((it.category&&it.category[ar?'ar':'en'])||'—')+'</td><td class="mono small">'+A.esc(it.date||'—')+'</td><td class="mono small">'+A.esc((it.updated_at||'').slice(0,10)||'—')+'</td>'+
     '<td>'+((it.tags||[]).map(function(t){return '<span class="tag">'+A.esc(t)+'</span>'}).join('')||'<span class="dim small">—</span>')+'</td>'+
     '<td style="white-space:nowrap"><a class="btn sm ghost" href="article-edit.html?id='+encodeURIComponent(it.id)+'">'+A.t('edit')+'</a> <a class="btn sm ghost" href="../article-'+A.lang()+'.html?id='+encodeURIComponent(it.id)+'" target="_blank" rel="noopener" aria-label="preview">'+A.icon('eye',13)+'</a> <button class="btn sm danger" data-arch="'+A.esc(it.id)+'" title="'+(A.lang()==='ar'?'أرشفة (إخفاء) المقال':'Archive (hide) article')+'">×</button></td></tr>';
    }).join('')+'</tbody></table></div>':'<div class="empty"><div class="ic">'+A.icon('doc',22)+'</div><h3>'+A.t('empty')+'</h3></div>')+
   '</div>'+
   (pages>1?'<div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button class="btn sm ghost" id="pg-p" '+(page===0?'disabled':'')+'>‹</button><span class="small dim" style="align-self:center">'+(page+1)+' / '+pages+'</span><button class="btn sm ghost" id="pg-n" '+(page>=pages-1?'disabled':'')+'>›</button></div>':'');
   var qEl=document.getElementById('q');
   qEl.oninput=function(){q=this.value.toLowerCase();page=0;paint();var el=document.getElementById('q');el.focus();el.setSelectionRange(el.value.length,el.value.length)};
   var pp=document.getElementById('pg-p'),pn=document.getElementById('pg-n');
   if(pp)pp.onclick=function(){page--;paint()};
   if(pn)pn.onclick=function(){page++;paint()};
   c.querySelectorAll('[data-arch]').forEach(function(bt){
    bt.onclick=function(){
     var id=bt.dataset.arch;
     A.modal({title:(A.lang()==='ar'?'أرشفة المقال — ':'Archive article — ')+id,body:(A.lang()==='ar'?'سيُخفى المقال عن الموقع العام ويبقى محفوظا ويمكن إظهاره من صفحة تحريره.':'The article is hidden from the public site and kept; you can show it again from its edit page.'),danger:true,onConfirm:function(done){
      A.api('/admin/api/articles/'+encodeURIComponent(id),{method:'DELETE'}).then(function(r){
       done();if(r._code===200){A.toast(A.t('updated'),'ok');setTimeout(function(){location.reload()},400)}else A.toast(A.t('failed'),'err');
      }).catch(function(){done();A.toast(A.t('errNet'),'err')});
     }});
    };
   });
   }
   paint();
  }).catch(function(){c.innerHTML='<div class="panel"><div class="empty"><h3>'+A.t('errNet')+'</h3></div></div>'});
 });
});
})();
</script>
</body>
</html>
