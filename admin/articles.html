<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المعبد — الرايتبس والحلول</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<script src="app.js"></script>
<script>
(function(){
var A=window.TORADMIN;
A.boot().then(function(ok){
 if(!ok)return;
 A.shell('articles','<b>'+A.t('nArticles')+'</b>',function(c){
  var ar=A.lang()==='ar',arOn=A.arabicEnabled();
  A.api('/admin/api/content').then(function(j){
   var items=(j.collections.articles||[]).slice();
   var q='',fSt='',fType='',PAGE=25,page=0;
   function stBadge(it){
    if(it.hidden||it.status==='archived')return A.badge(A.t('stArch'),'dim');
    if(it.status==='draft')return A.badge(A.t('stDraft'),'info');
    if(it.publish_at&&Date.parse(it.publish_at)>Date.now())return A.badge(A.t('stSched'),'warn');
    if(it.sample)return A.badge(A.t('stDemo'),'warn');
    return it.available?A.badge(A.t('stPub'),'ok'):A.badge(A.t('stPrep'),'info');
   }
   function paint(){
    var filtered=items.filter(function(it){
     if(fType&&(it.writeup_type||'concept')!==fType)return false;
     if(fSt==='arch'&&!(it.hidden||it.status==='archived'))return false;
     if(fSt==='draft'&&it.status!=='draft')return false;
     if(fSt==='pub'&&(it.hidden||it.status==='archived'||it.status==='draft'))return false;
     if(q){var hay=((arOn?(it.title_ar||''):'')+' '+(it.title_en||'')+' '+it.id+' '+(it.tags||[]).join(' ')).toLowerCase();if(hay.indexOf(q)===-1)return false}
     return true;
    });
    var pages=Math.max(1,Math.ceil(filtered.length/PAGE));if(page>=pages)page=pages-1;
    var view=filtered.slice(page*PAGE,(page+1)*PAGE);
    c.innerHTML='<div class="page-head"><div class="page-head-main"><h1>'+A.t('nArticles')+'</h1><span class="sub">'+(ar?'المقالات التقنية وشروحات حلول التحديات.':'Technical explainers and challenge writeups.')+'</span></div>'+
    '<div class="acts"><a class="btn primary" href="article-edit.html">'+A.icon('doc',15)+(ar?'رايتب جديد':'New writeup')+'</a></div></div>'+
    '<div class="frow">'+
     '<input class="input searchbar" id="q" type="search" aria-label="'+A.esc(A.t('search'))+'" placeholder="'+A.esc(A.t('search'))+'" value="'+A.esc(q)+'">'+
     '<select class="input" id="f-st" aria-label="'+A.esc(A.t('thStatus'))+'"><option value="">'+(ar?'كل الحالات':'All statuses')+'</option><option value="pub"'+(fSt==='pub'?' selected':'')+'>'+A.t('stPub')+'</option><option value="draft"'+(fSt==='draft'?' selected':'')+'>'+A.t('stDraft')+'</option><option value="arch"'+(fSt==='arch'?' selected':'')+'>'+A.t('stArch')+'</option></select>'+
     '<select class="input" id="f-ty" aria-label="'+(ar?'النوع':'Type')+'"><option value="">'+(ar?'كل الأنواع':'All types')+'</option><option value="concept"'+(fType==='concept'?' selected':'')+'>'+(ar?'شرح تقني':'Concept')+'</option><option value="walkthrough"'+(fType==='walkthrough'?' selected':'')+'>'+(ar?'حل تحدٍّ':'Walkthrough')+'</option></select>'+
     '<span class="count-pill">'+filtered.length+' / '+items.length+'</span>'+
    '</div>'+
    '<div class="tbl-wrap">'+(view.length?'<table class="tbl"><thead><tr><th scope="col">'+A.t('thTitle')+'</th><th scope="col">'+A.t('thStatus')+'</th><th scope="col">'+(ar?'اللغة':'Lang')+'</th><th scope="col">'+A.t('thCat')+'</th><th scope="col">'+(ar?'تاريخ النشر':'Published')+'</th><th scope="col">'+(ar?'الوسوم':'Tags')+'</th><th scope="col">'+A.t('actions')+'</th></tr></thead><tbody>'+
     view.map(function(it){
      var title=(ar&&arOn)?(it.title_ar||it.title_en):(it.title_en||(arOn&&it.title_ar));
      var catTxt=(it.category&&((ar&&arOn)?(it.category.ar||it.category.en):(it.category.en||(arOn&&it.category.ar))))||'—';
      return '<tr><td><div class="t-main"><a href="article-edit.html?id='+encodeURIComponent(it.id)+'">'+A.esc(title||it.id)+'</a></div><div class="t-sub mono">'+A.esc(it.id)+'</div></td>'+
      '<td>'+stBadge(it)+'</td>'+
      '<td class="mono small">'+(((arOn&&it.title_ar)?'AR ':'')+(it.title_en?'EN':''))+'</td>'+
      '<td class="small">'+A.esc(catTxt)+'</td>'+
      '<td class="mono small dim">'+A.esc(it.date||'—')+'</td>'+
      '<td>'+((it.tags||[]).slice(0,4).map(function(t){return '<span class="tag">'+A.esc(t)+'</span>'}).join('')||'<span class="dim small">—</span>')+'</td>'+
      '<td class="acts-cell"><div class="inline-acts" style="justify-content:flex-end">'+
       '<a class="btn sm ghost" href="article-edit.html?id='+encodeURIComponent(it.id)+'">'+A.t('edit')+'</a>'+
       '<a class="btn sm ghost" href="preview.html?kind=article&amp;lang='+(arOn?A.lang():'en')+'&amp;id='+encodeURIComponent(it.id)+'" target="_blank" rel="noopener" aria-label="'+(ar?'معاينة':'Preview')+'" title="'+(ar?'معاينة المحفوظ':'Preview saved')+'">'+A.icon('eye',14)+'</a>'+
       '<button type="button" class="btn sm danger" data-arch="'+A.esc(it.id)+'">'+(ar?'أرشفة':'Archive')+'</button>'+
      '</div></td></tr>';
     }).join('')+'</tbody></table>'
     :'<div class="empty"><div class="ic">'+A.icon('doc',22)+'</div><h3>'+A.t('empty')+'</h3><p>'+A.t('emptySub')+'</p></div>')+'</div>'+
    (pages>1?'<div class="pager"><button type="button" class="btn sm ghost" id="pg-p" '+(page===0?'disabled':'')+'>‹</button><span>'+(page+1)+' / '+pages+'</span><button type="button" class="btn sm ghost" id="pg-n" '+(page>=pages-1?'disabled':'')+'>›</button></div>':'');

    var qEl=document.getElementById('q');
    qEl.oninput=function(){q=this.value.toLowerCase();page=0;paint();var el=document.getElementById('q');el.focus();el.setSelectionRange(el.value.length,el.value.length)};
    document.getElementById('f-st').onchange=function(){fSt=this.value;page=0;paint()};
    document.getElementById('f-ty').onchange=function(){fType=this.value;page=0;paint()};
    var pp=document.getElementById('pg-p'),pn=document.getElementById('pg-n');
    if(pp)pp.onclick=function(){page--;paint()};
    if(pn)pn.onclick=function(){page++;paint()};
    c.querySelectorAll('[data-arch]').forEach(function(bt){
     bt.onclick=function(){
      var id=bt.dataset.arch;
      A.modal({title:(ar?'أرشفة الرايتب — ':'Archive writeup — ')+id,body:(ar?'سيُخفى المقال عن الموقع العام ويبقى محفوظًا ويمكن استعادته من صفحة تحريره.':'The writeup is hidden from the public site and kept; you can restore it from its edit page.'),danger:true,onConfirm:function(done){
       A.api('/admin/api/articles/'+encodeURIComponent(id),{method:'DELETE'}).then(function(r){
        done();if(r._code===200){A.toast(A.t('updated'),'ok');setTimeout(function(){location.reload()},400)}else A.toast(A.t('failed'),'err');
       }).catch(function(){done();A.toast(A.t('errNet'),'err')});
      }});
     };
    });
   }
   paint();
  }).catch(function(){c.innerHTML='<div class="empty"><h3>'+A.t('errNet')+'</h3></div>'});
 });
});
})();
</script>
</body>
</html>
