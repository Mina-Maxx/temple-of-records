<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المعبد — لوحة التحكم</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel+Decorative:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<script src="app.js"></script>
<script>
(function(){
var A=window.TORADMIN;
A.boot().then(function(ok){
 if(!ok)return;
 A.shell('dashboard','<b>'+A.t('nDash')+'</b>',function(c){
  Promise.all([A.api('/admin/api/stats'),A.api('/admin/api/audit')]).then(function(rs){
   var s=rs[0],au=(rs[1].audit||[]).slice(0,6);
   var health=[];
   health.push([A.t('stAvail')+': '+s.challenges_available+' / '+s.challenges,A.t('sChal')]);
   health.push([s.demo_data?A.t('stDemo'):'',A.t('sampleData')]);
   c.innerHTML=
   '<div class="page-head"><h1>'+A.t('nDash')+'</h1><span class="sub">'+A.t('dashWelcome')+'</span>'+
   '<div class="acts"><a class="btn primary" href="challenge-edit.html">'+A.icon('flag',15)+(A.lang()==='ar'?A.t('create')+' '+A.t('sChal'):'Create challenge')+'</a></div></div>'+
   '<div class="grid-stats">'+
    stat(A.t('sChal'),s.challenges,A.t('sAvail')+': '+s.challenges_available)+
    stat(A.lang()==='ar'?'تحديات منشورة':'Published challenges',s.challenges_published,'')+stat(A.t('sArt'),s.articles,'')+
    stat(A.t('sSolves'),s.total_solves,'')+
    stat(A.t('sSubs'),s.total_submissions,'')+
    stat(A.t('sPlayers'),s.players,'')+
    stat(A.lang()==='ar'?'قيد التحضير':'In preparation',s.challenges_preparation,'')+stat(A.lang()==='ar'?'ملفات الأدلة (خارجية)':'Evidence (external)',s.evidence_count,A.lang()==='ar'?'0 بايت مستضاف':'0 bytes hosted')+
   '</div>'+
   '<div class="row2">'+
   '<div class="panel"><h2>'+(A.lang()==='ar'?'المحاولات — آخر 14 يومًا':'Submissions — last 14 days')+'</h2>'+barChart(s.chart_days||[])+'</div>'+
   '<div class="panel"><h2>'+(A.lang()==='ar'?'الحلول — آخر 14 يومًا':'Solves — last 14 days')+'</h2>'+barChart((s.chart_days||[]).map(d=>({day:d.day,submissions:d.solves})))+'</div><div class="panel"><h2>'+(A.lang()==='ar'?'الحلول لكل تحدٍّ':'Solves per challenge')+'</h2>'+solveChart(s.chart_solves||{})+
   '<h2 style="margin-top:14px">'+(A.lang()==='ar'?'نتائج المحاولات':'Submission results')+'</h2>'+resultChart(s.chart_results||{})+'</div>'+
   '</div>'+
   '<div class="row2">'+
   '<div class="panel"><h2>'+A.t('health')+'</h2><p class="sub">'+A.t('sampleData')+'</p>'+
    '<div class="kv">'+
    '<dt>'+A.t('sChal')+'</dt><dd>'+s.challenges_available+' / '+s.challenges+' '+A.t('stAvail')+'</dd>'+
    '<dt>'+A.t('demoNote')+'</dt><dd>'+(s.demo_data?A.badge(A.t('stDemo'),'warn'):A.badge('OK','ok'))+'</dd>'+
    '<dt>'+A.t('nFlags')+'</dt><dd>'+A.badge('SHA-256','info')+' <span class="small dim">server-side</span></dd>'+
    '</div></div>'+
   '<div class="panel"><h2>'+A.t('recentAct')+'</h2><p class="sub"></p>'+
    (au.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>'+A.t('auditTs')+'</th><th>'+A.t('auditAction')+'</th><th>'+A.t('auditEntity')+'</th><th>'+A.t('auditRes')+'</th></tr></thead><tbody>'+
     au.map(function(a){var al=A.actLabel(a.action),rl=A.resLabel(a.result);return '<tr><td class="small dim">'+A.fmtTs(a.ts)+'</td><td>'+A.esc(al)+'<div class="small dim mono" style="font-size:.68rem">'+A.esc(a.action)+'</div></td><td class="small">'+A.esc(a.entity)+'</td><td>'+(a.result==='ok'?A.badge(rl,'ok'):A.badge(rl,a.result==='failed'?'err':'info'))+'</td></tr>'}).join('')+
    '</tbody></table></div>':'<div class="empty"><div class="ic">'+A.icon('list',22)+'</div><h3>'+A.t('empty')+'</h3></div>')+
   '</div></div>';
  }).catch(function(){c.innerHTML='<div class="panel"><div class="empty"><h3>'+A.t('errNet')+'</h3></div></div>'});
 });
 function barChart(days){
  var W=520,H=140,P=22,max=Math.max(1,Math.max.apply(null,days.map(function(d){return d.submissions})));
  if(!days.length)return '<div class="empty"><h3>'+A.t('empty')+'</h3></div>';
  var bw=(W-P*2)/days.length;
  var bars=days.map(function(d,i){
   var h=(d.submissions/max)*(H-P*2),x=P+i*bw+2,y=H-P-h;
   return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-4).toFixed(1)+'" height="'+Math.max(0.5,h).toFixed(1)+'" rx="2" fill="#c9a45c"><title>'+d.day+': '+d.submissions+'</title></rect>';
  }).join('');
  var lbl='<text x="'+P+'" y="'+(H-6)+'" fill="#8a8577" font-size="9">'+days[0].day.slice(5)+'</text><text x="'+(W-P)+'" y="'+(H-6)+'" fill="#8a8577" font-size="9" text-anchor="end">'+days[days.length-1].day.slice(5)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img"><line x1="'+P+'" y1="'+(H-P)+'" x2="'+(W-P)+'" y2="'+(H-P)+'" stroke="#2a2f33"/>'+bars+lbl+'</svg>';
 }
 function solveChart(m){
  var ks=Object.keys(m);if(!ks.length)return '<div class="empty" style="padding:14px"><h3>'+A.t('empty')+'</h3></div>';
  var max=Math.max.apply(null,ks.map(function(k){return m[k]}));
  return '<div style="display:grid;gap:8px;margin-top:6px">'+ks.map(function(k){
   var pct=Math.round(m[k]/max*100);
   return '<div><div class="small mono" style="margin-bottom:3px">'+A.esc(k)+' <span class="dim">'+m[k]+'</span></div><div style="height:8px;background:#1a1e22;border-radius:4px"><div style="height:8px;width:'+pct+'%;background:#c9a45c;border-radius:4px"></div></div></div>';
  }).join('')+'</div>';
 }
 function resultChart(m){
  var ks=Object.keys(m);if(!ks.length)return '<div class="empty" style="padding:14px"><h3>'+A.t('empty')+'</h3></div>';
  var tot=ks.reduce(function(a,k){return a+m[k]},0)||1;
  var colors={correct:'#5da875',wrong:'#c0655f',already:'#6d8fbf',rate_limited:'#c9a45c'};
  return '<div style="display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:6px">'+ks.map(function(k){return '<div style="width:'+(m[k]/tot*100)+'%;background:'+(colors[k]||'#555')+'" title="'+k+': '+m[k]+'"></div>'}).join('')+'</div>'+
  '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px">'+ks.map(function(k){return '<span class="small"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+(colors[k]||'#555')+';margin-inline-end:5px"></span>'+A.esc(A.resLabel(k))+' <span class="dim mono">'+m[k]+'</span></span>'}).join('')+'</div>';
 }
 function stat(k,v,d){return '<div class="stat"><div class="k">'+A.esc(k)+'</div><div class="v">'+v+'</div>'+(d?'<div class="d">'+A.esc(d)+'</div>':'')+'</div>'}
});
})();
</script>
</body>
</html>
