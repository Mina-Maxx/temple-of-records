<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المعبد — التصنيفات والوسوم</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel+Decorative:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<script src="app.js"></script>
<script>
(function(){
var A=window.TORADMIN;
A.boot().then(function(ok){
 if(!ok)return;
 A.shell('cats','<b>'+A.t('nCats')+'</b>',function(c){
  var ar=A.lang()==='ar';
  A.api('/admin/api/content').then(function(j){
   var cols=j.collections||{};
   var managed=cols.categories||[];var managedTags=cols.tags||[];
   var tags={},cats={};
   Object.keys(cols).forEach(function(col){(cols[col]||[]).forEach(function(it){
    (it.tags||[]).forEach(function(t){(tags[t]=tags[t]||[]).push(col+':'+it.id)});
    var cat=ar?(it.category_ar):(it.category_en||it.category_ar);
    if(cat)(cats[cat]=cats[cat]||[]).push(col+':'+it.id);
   })});
   function row(name,uses,extra){
    return '<tr><td><span class="tag" style="font-size:.85rem">'+A.esc(name)+'</span></td><td class="mono">'+uses.length+'</td><td class="small dim">'+uses.map(function(u){return '<span class="mono" style="margin-inline-end:8px">'+A.esc(u)+'</span>'}).join('')+'</td><td>'+(extra||'')+'</td></tr>';
   }
   var tagRows=Object.keys(tags).sort().map(function(t){return row(t,tags[t],'<button class="btn sm ghost" data-rn="'+A.esc(t)+'">'+(ar?'إعادة تسمية':'Rename')+'</button>')}).join('');
   var catRows=Object.keys(cats).sort().map(function(t){return row(t,cats[t],'<span class="small muted">'+(ar?'تُدار من محرر التحدي':'Managed in the challenge editor')+'</span>')}).join('');
   var mgRows=managed.filter(g=>!g.hidden).map(function(g){
    return '<tr><td class="mono">'+A.esc(g.id)+'<div class="t-sub">'+A.esc(g.kind||'challenge')+'</div><div class="t-sub">'+A.esc((g.slug&&g.slug.ar)||'')+' / '+A.esc((g.slug&&g.slug.en)||'')+'</div></td><td>'+A.esc((g.name&&g.name.ar)||'')+'</td><td dir="ltr" style="text-align:start">'+A.esc((g.name&&g.name.en)||'')+'</td><td class="small dim">'+A.esc(ar?((g.description&&g.description.ar)||''):((g.description&&g.description.en)||''))+'</td><td style="white-space:nowrap"><button class="btn sm ghost" data-ced="'+A.esc(g.id)+'">'+A.t('edit')+'</button> <button class="btn sm danger" data-cdel="'+A.esc(g.id)+'">'+A.t('del')+'</button></td></tr>';
   }).join('');
   var managedTagRows=managedTags.filter(g=>!g.hidden).map(function(g){return '<tr><td class="mono">'+A.esc(g.id)+'</td><td>'+A.esc(g.name&&g.name.ar||'')+'</td><td>'+A.esc(g.name&&g.name.en||'')+'</td><td>'+A.esc(g.slug&&g.slug.ar||'')+' / '+A.esc(g.slug&&g.slug.en||'')+'</td><td><button class="btn sm ghost" data-ted="'+A.esc(g.id)+'">'+A.t('edit')+'</button> <button class="btn sm danger" data-tdel="'+A.esc(g.id)+'">'+A.t('del')+'</button></td></tr>'}).join('');
   c.innerHTML='<div class="page-head"><h1>'+A.t('nCats')+'</h1><span class="sub">'+(ar?'الوسوم مستخدمة عبر كل المجموعات؛ إعادة التسمية تكتب عبر كل العناصر فورًا. الفئات ثنائية اللغة وتُعدّل لكل تحدٍّ من محرره.':'Tags span every collection; renaming writes across all items immediately. Categories are bilingual and edited per challenge in its editor.')+'</span></div>'+
   '<div class="panel"><h2>'+(ar?'الفئات المُدارة (ثنائية اللغة)':'Managed categories (bilingual)')+'</h2>'+
   '<p class="sub">'+(ar?'فئات بمعرّف (slug) واسم ووصف باللغتين. تظهر كاقتراحات في محرر التحدي.':'Categories with a slug and bilingual name/description. Offered as suggestions in the challenge editor.')+'</p>'+
   (mgRows?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>slug</th><th>'+(ar?'الاسم (عربي)':'Name (AR)')+'</th><th>'+(ar?'الاسم (إنجليزي)':'Name (EN)')+'</th><th>'+(ar?'الوصف':'Description')+'</th><th></th></tr></thead><tbody>'+mgRows+'</tbody></table></div>':'<div class="empty"><div class="ic">'+A.icon('tags',22)+'</div><h3>'+A.t('empty')+'</h3></div>')+
   '<div style="margin-top:12px"><button class="btn primary sm" id="cat-new">'+A.t('create')+'</button></div></div>'+
   '<div class="panel"><h2>'+(ar?'قاموس الوسوم باللغتين':'Bilingual tag library')+'</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>ID</th><th>AR</th><th>EN</th><th>Slugs AR / EN</th><th></th></tr></thead><tbody>'+managedTagRows+'</tbody></table></div><button class="btn primary sm" id="tag-new" style="margin-top:12px">'+A.t('create')+'</button></div>'+
   '<div class="panel"><h2>'+(ar?'الوسوم المستخدمة':'Tags in use')+'</h2>'+
   (tagRows?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>'+(ar?'الوسم':'Tag')+'</th><th>'+(ar?'الاستخدام':'Uses')+'</th><th>'+(ar?'العناصر':'Items')+'</th><th></th></tr></thead><tbody>'+tagRows+'</tbody></table></div>':'<div class="empty"><div class="ic">'+A.icon('tags',22)+'</div><h3>'+A.t('empty')+'</h3></div>')+'</div>'+
   '<div class="panel"><h2>'+(ar?'الفئات (التحديات)':'Categories (challenges)')+'</h2>'+
   (catRows?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>'+(ar?'الفئة':'Category')+'</th><th>'+(ar?'الاستخدام':'Uses')+'</th><th>'+(ar?'العناصر':'Items')+'</th><th></th></tr></thead><tbody>'+catRows+'</tbody></table></div>':'<div class="empty"><div class="ic">'+A.icon('tags',22)+'</div><h3>'+A.t('empty')+'</h3></div>')+'</div>';
   function catForm(g,col){col=col||'categories';
    var isNew=!g;g=g||{id:'',name:{ar:'',en:''},description:{ar:'',en:''}};g.slug=g.slug||{};
    var body='<div class="field"><label>slug</label><input class="input mono" id="cf-id" dir="ltr" value="'+A.esc(g.id)+'" '+(isNew?'':'disabled')+' placeholder="log-analysis"></div>'+
    '<div class="frow"><div class="fcol ar-only"><label>'+(ar?'الاسم (عربي)':'Name (AR)')+'</label><input class="input" id="cf-nar" value="'+A.esc(g.name.ar||'')+'"></div>'+
    '<div class="fcol"><label>'+(ar?'الاسم (إنجليزي)':'Name (EN)')+'</label><input class="input" id="cf-nen" dir="ltr" value="'+A.esc(g.name.en||'')+'"></div></div>'+
    '<div class="frow"><div class="fcol ar-only"><label>'+(ar?'وصف (عربي، اختياري)':'Description (AR, optional)')+'</label><input class="input" id="cf-dar" value="'+A.esc(g.description.ar||'')+'"></div>'+
    '<div class="fcol"><label>'+(ar?'وصف (إنجليزي، اختياري)':'Description (EN, optional)')+'</label><input class="input" id="cf-den" dir="ltr" value="'+A.esc(g.description.en||'')+'"></div></div>';
    body+='<div class="field"><label>'+(ar?'نوع الفئة':'Category type')+'</label><select class="input" id="cf-kind">'+['challenge','article','kb','project'].map(function(k){return '<option value="'+k+'"'+((g.kind||'challenge')===k?' selected':'')+'>'+({challenge:ar?'التحديات':'Challenges',article:ar?'المقالات':'Articles',kb:ar?'قاعدة المعرفة':'Knowledge base',project:ar?'المشاريع':'Projects'})[k]+'</option>'}).join('')+'</select></div><div class="frow"><div class="fcol"><label>Slug AR</label><input class="input" id="cf-sar" value="'+A.esc(g.slug.ar||'')+'"></div><div class="fcol"><label>Slug EN</label><input class="input" dir="ltr" id="cf-sen" value="'+A.esc(g.slug.en||'')+'"></div></div>';
    A.modal({title:isNew?(ar?'فئة جديدة':'New category'):(ar?'تعديل فئة':'Edit category'),html:true,body:body,onConfirm:function(done){
     var item={kind:document.getElementById('cf-kind').value,slug:{ar:document.getElementById('cf-sar').value,en:document.getElementById('cf-sen').value},id:document.getElementById('cf-id').value.trim(),name:{ar:document.getElementById('cf-nar').value,en:document.getElementById('cf-nen').value},description:{ar:document.getElementById('cf-dar').value,en:document.getElementById('cf-den').value}};
     var req=isNew?A.api('/admin/api/collection/'+col,{method:'POST',body:item}):A.api('/admin/api/collection/'+col+'/'+encodeURIComponent(g.id),{method:'PUT',body:item});
     req.then(function(r){done();if(r._code===200){A.toast(A.t('saved'),'ok');setTimeout(function(){location.reload()},400)}else A.toast(r.error||A.t('failed'),'err')}).catch(function(){done();A.toast(A.t('errNet'),'err')});
    }});
   }
   document.getElementById('cat-new').onclick=function(){catForm(null)};document.getElementById('tag-new').onclick=function(){catForm(null,'tags')};c.querySelectorAll('[data-ted]').forEach(b=>b.onclick=function(){catForm(managedTags.find(x=>x.id===b.dataset.ted),'tags')});c.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=function(){A.modal({title:A.t('del'),body:ar?'أرشفة تعريف الوسم فقط، لا تمسح استخداماته من المحتوى.':'Archive the tag definition only. Content usages remain.',danger:true,onConfirm:function(done){A.api('/admin/api/collection/tags/'+encodeURIComponent(b.dataset.tdel),{method:'DELETE'}).then(function(r){done();if(r._code===200)location.reload();else A.toast(r.error||A.t('failed'),'err')})}})});
   c.querySelectorAll('[data-ced]').forEach(function(b){b.onclick=function(){catForm(managed.filter(function(x){return x.id===b.dataset.ced})[0])}});
   c.querySelectorAll('[data-cdel]').forEach(function(b){b.onclick=function(){
    var id=b.dataset.cdel;
    A.modal({title:A.t('del')+' — '+id,body:A.t('confirmDel'),danger:true,onConfirm:function(done){
     A.api('/admin/api/collection/categories/'+encodeURIComponent(id),{method:'DELETE'}).then(function(r){
      done();if(r._code===200){A.toast(A.t('updated'),'ok');setTimeout(function(){location.reload()},400)}else A.toast(r.error||A.t('failed'),'err');
     }).catch(function(){done();A.toast(A.t('errNet'),'err')});
    }});
   }});
   c.querySelectorAll('[data-rn]').forEach(function(b){
    b.onclick=function(){
     var from=b.dataset.rn;
     var to=prompt((ar?'إعادة تسمية «'+from+'» إلى:':'Rename "'+from+'" to:'),from);
     if(!to||to.trim()===from)return;
     A.modal({title:(ar?'إعادة تسمية وسم':'Rename tag'),body:(ar?'سيُعاد تسمية «'+from+'» إلى «'+to.trim()+'» في '+tags[from].length+' عنصر.':'"'+from+'" becomes "'+to.trim()+'" in '+tags[from].length+' item(s).'),onConfirm:function(done){
      A.api('/admin/api/content/rename-tag',{method:'POST',body:{from:from,to:to.trim()}}).then(function(r){
       done();if(r._code===200){A.toast(A.t('updated')+' ('+r.touched+')','ok');setTimeout(function(){location.reload()},400)}else A.toast(r.error||A.t('failed'),'err');
      }).catch(function(){done();A.toast(A.t('errNet'),'err')});
     }});
    };
   });
  }).catch(function(){c.innerHTML='<div class="panel"><div class="empty"><h3>'+A.t('errNet')+'</h3></div></div>'});
 });
});
})();
</script>
</body>
</html>
