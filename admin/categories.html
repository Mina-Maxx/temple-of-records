<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المعبد — التصنيفات والوسوم</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<script src="app.js"></script>
<script>
(function(){
var A=window.TORADMIN;
A.boot().then(function(ok){
 if(!ok)return;
 A.shell('cats','<b>'+A.t('nCats')+'</b>',function(c){
  var ar=A.lang()==='ar',arOn=A.arabicEnabled();
  A.api('/admin/api/content').then(function(j){
   var cols=j.collections||{};
   var managed=cols.categories||[],managedTags=cols.tags||[];
   var tags={},cats={};
   Object.keys(cols).forEach(function(col){(cols[col]||[]).forEach(function(it){
    (it.tags||[]).forEach(function(t){(tags[t]=tags[t]||[]).push(col+':'+it.id)});
    var cat=(ar&&arOn)?(it.category_ar||it.category_en):(it.category_en||(arOn&&it.category_ar));
    if(cat)(cats[cat]=cats[cat]||[]).push(col+':'+it.id);
   })});
   function row(name,uses,extra){
    return '<tr><td><span class="tag">'+A.esc(name)+'</span></td><td class="mono">'+uses.length+'</td><td class="small dim">'+uses.map(function(u){return '<span class="mono" style="margin-inline-end:8px">'+A.esc(u)+'</span>'}).join('')+'</td><td class="acts-cell">'+(extra||'')+'</td></tr>';
   }
   var tagRows=Object.keys(tags).sort().map(function(t){return row(t,tags[t],'<button type="button" class="btn sm ghost" data-rn="'+A.esc(t)+'">'+(ar?'إعادة تسمية':'Rename')+'</button>')}).join('');
   var catRows=Object.keys(cats).sort().map(function(t){return row(t,cats[t],'<span class="small muted">'+(ar?'تُعدَّل من المحرر':'Edited per item')+'</span>')}).join('');
   var mgRows=managed.filter(function(g){return !g.hidden}).map(function(g){
    var slugDisp=arOn?(A.esc((g.slug&&g.slug.ar)||'')+' / '+A.esc((g.slug&&g.slug.en)||'')):A.esc((g.slug&&g.slug.en)||'');
    var descDisp=(ar&&arOn)?((g.description&&g.description.ar)||''):((g.description&&g.description.en)||'');
    return '<tr><td class="mono">'+A.esc(g.id)+'<div class="t-sub">'+A.esc(g.kind||'challenge')+' · '+slugDisp+'</div></td><td class="ar-only">'+A.esc((g.name&&g.name.ar)||'')+'</td><td dir="ltr">'+A.esc((g.name&&g.name.en)||'')+'</td><td class="small dim">'+A.esc(descDisp||'—')+'</td><td class="acts-cell"><div class="inline-acts" style="justify-content:flex-end"><button type="button" class="btn sm ghost" data-ced="'+A.esc(g.id)+'">'+A.t('edit')+'</button><button type="button" class="btn sm danger" data-cdel="'+A.esc(g.id)+'">'+A.t('del')+'</button></div></td></tr>';
   }).join('');
   var managedTagRows=managedTags.filter(function(g){return !g.hidden}).map(function(g){
    var slugDisp=arOn?(A.esc((g.slug&&g.slug.ar)||'')+' / '+A.esc((g.slug&&g.slug.en)||'')):A.esc((g.slug&&g.slug.en)||'');
    return '<tr><td class="mono">'+A.esc(g.id)+'</td><td class="ar-only">'+A.esc((g.name&&g.name.ar)||'')+'</td><td dir="ltr">'+A.esc((g.name&&g.name.en)||'')+'</td><td class="small dim">'+slugDisp+'</td><td class="acts-cell"><div class="inline-acts" style="justify-content:flex-end"><button type="button" class="btn sm ghost" data-ted="'+A.esc(g.id)+'">'+A.t('edit')+'</button><button type="button" class="btn sm danger" data-tdel="'+A.esc(g.id)+'">'+A.t('del')+'</button></div></td></tr>';
   }).join('');

   c.innerHTML='<div class="page-head"><div class="page-head-main"><h1>'+A.t('nCats')+'</h1><span class="sub">'+(ar?'تعريف الفئات وقاموس الوسوم وإعادة التسمية الجماعية عبر المجموعات.':'Manage structured categories, tag library entries, and bulk tag renames across collections.')+'</span></div>'+
   '<div class="acts"><button type="button" class="btn primary" id="cat-new">+ '+(ar?'فئة جديدة':'New category')+'</button><button type="button" class="btn ghost" id="tag-new">+ '+(ar?'وسم جديد':'New tag')+'</button></div></div>'+
   '<section class="mb-4"><h2 class="mb-3">'+(ar?'الفئات المُدارة':'Managed categories')+'</h2>'+
   '<div class="tbl-wrap">'+(mgRows?'<table class="tbl"><thead><tr><th scope="col">ID / Kind</th><th scope="col" class="ar-only">'+(ar?'الاسم (عربي)':'Name (AR)')+'</th><th scope="col">'+(ar?'الاسم (إنجليزي)':'Name (EN)')+'</th><th scope="col">'+(ar?'الوصف':'Description')+'</th><th scope="col">'+A.t('actions')+'</th></tr></thead><tbody>'+mgRows+'</tbody></table>':'<div class="empty"><div class="ic">'+A.icon('tags',20)+'</div><h3>'+A.t('empty')+'</h3></div>')+'</div></section>'+
   '<section class="mb-4"><h2 class="mb-3">'+(ar?'قاموس الوسوم':'Tag library')+'</h2>'+
   '<div class="tbl-wrap">'+(managedTagRows?'<table class="tbl"><thead><tr><th scope="col">ID</th><th scope="col" class="ar-only">AR</th><th scope="col">EN</th><th scope="col">Slug</th><th scope="col">'+A.t('actions')+'</th></tr></thead><tbody>'+managedTagRows+'</tbody></table>':'<div class="empty"><div class="ic">'+A.icon('tags',20)+'</div><h3>'+A.t('empty')+'</h3></div>')+'</div></section>'+
   '<div class="dash-grid">'+
    '<section><h2 class="mb-3">'+(ar?'الوسوم المستخدمة':'Tags in use')+'</h2><div class="tbl-wrap">'+(tagRows?'<table class="tbl"><thead><tr><th scope="col">'+(ar?'الوسم':'Tag')+'</th><th scope="col">'+(ar?'العدد':'Uses')+'</th><th scope="col">'+(ar?'العناصر':'Items')+'</th><th scope="col">'+A.t('actions')+'</th></tr></thead><tbody>'+tagRows+'</tbody></table>':'<div class="empty"><h3>'+A.t('empty')+'</h3></div>')+'</div></section>'+
    '<section><h2 class="mb-3">'+(ar?'الفئات المستخدمة في المحتوى':'Categories in use')+'</h2><div class="tbl-wrap">'+(catRows?'<table class="tbl"><thead><tr><th scope="col">'+(ar?'الفئة':'Category')+'</th><th scope="col">'+(ar?'العدد':'Uses')+'</th><th scope="col">'+(ar?'العناصر':'Items')+'</th><th scope="col"></th></tr></thead><tbody>'+catRows+'</tbody></table>':'<div class="empty"><h3>'+A.t('empty')+'</h3></div>')+'</div></section>'+
   '</div>';

   function catForm(g,col){
    col=col||'categories';
    var isNew=!g;g=g||{id:'',name:{ar:'',en:''},description:{ar:'',en:''}};g.slug=g.slug||{};
    var body='<div class="field"><label for="cf-id">slug / ID</label><input class="input mono" id="cf-id" dir="ltr" value="'+A.esc(g.id)+'" '+(isNew?'':'disabled')+' placeholder="log-analysis"></div>'+
    '<div class="frow"><div class="fcol ar-only"><label for="cf-nar">'+(ar?'الاسم (عربي)':'Name (AR)')+'</label><input class="input" id="cf-nar" value="'+A.esc(g.name.ar||'')+'"></div>'+
    '<div class="fcol"><label for="cf-nen">'+(ar?'الاسم (إنجليزي)':'Name (EN)')+'</label><input class="input" id="cf-nen" dir="ltr" value="'+A.esc(g.name.en||'')+'"></div></div>'+
    '<div class="frow"><div class="fcol ar-only"><label for="cf-dar">'+(ar?'وصف (عربي)':'Description (AR)')+'</label><input class="input" id="cf-dar" value="'+A.esc(g.description.ar||'')+'"></div>'+
    '<div class="fcol"><label for="cf-den">'+(ar?'وصف (إنجليزي)':'Description (EN)')+'</label><input class="input" id="cf-den" dir="ltr" value="'+A.esc(g.description.en||'')+'"></div></div>'+
    '<div class="field"><label for="cf-kind">'+(ar?'النوع':'Type')+'</label><select class="input" id="cf-kind">'+['challenge','article','investigation'].map(function(k){return '<option value="'+k+'"'+((g.kind||'challenge')===k?' selected':'')+'>'+({challenge:ar?'التحديات':'Challenges',article:ar?'الرايتبس':'Writeups',investigation:ar?'التحقيقات':'Investigations'})[k]+'</option>'}).join('')+'</select></div>'+
    '<div class="frow"><div class="fcol ar-only"><label for="cf-sar">Slug AR</label><input class="input" id="cf-sar" value="'+A.esc(g.slug.ar||'')+'"></div><div class="fcol"><label for="cf-sen">Slug EN</label><input class="input mono" dir="ltr" id="cf-sen" value="'+A.esc(g.slug.en||'')+'"></div></div>';
    A.modal({title:isNew?(col==='tags'?(ar?'وسم جديد':'New tag'):(ar?'فئة جديدة':'New category')):(col==='tags'?(ar?'تعديل وسم':'Edit tag'):(ar?'تعديل فئة':'Edit category')),html:true,body:body,onConfirm:function(done){
     var item={kind:document.getElementById('cf-kind').value,slug:{ar:document.getElementById('cf-sar').value,en:document.getElementById('cf-sen').value},id:document.getElementById('cf-id').value.trim(),name:{ar:document.getElementById('cf-nar').value,en:document.getElementById('cf-nen').value},description:{ar:document.getElementById('cf-dar').value,en:document.getElementById('cf-den').value}};
     var req=isNew?A.api('/admin/api/collection/'+col,{method:'POST',body:item}):A.api('/admin/api/collection/'+col+'/'+encodeURIComponent(g.id),{method:'PUT',body:item});
     req.then(function(r){done();if(r._code===200){A.toast(A.t('saved'),'ok');setTimeout(function(){location.reload()},350)}else A.toast(r.error||A.t('failed'),'err')}).catch(function(){done();A.toast(A.t('errNet'),'err')});
    }});
   }
   document.getElementById('cat-new').onclick=function(){catForm(null,'categories')};
   document.getElementById('tag-new').onclick=function(){catForm(null,'tags')};
   c.querySelectorAll('[data-ted]').forEach(function(b){b.onclick=function(){catForm(managedTags.find(function(x){return x.id===b.dataset.ted}),'tags')}});
   c.querySelectorAll('[data-tdel]').forEach(function(b){b.onclick=function(){
    A.modal({title:A.t('del'),body:ar?'أرشفة تعريف الوسم فقط، ولا تُحذف استخداماته من المحتوى.':'Archives the tag library definition only; item usages stay unchanged.',danger:true,onConfirm:function(done){
     A.api('/admin/api/collection/tags/'+encodeURIComponent(b.dataset.tdel),{method:'DELETE'}).then(function(r){done();if(r._code===200)location.reload();else A.toast(r.error||A.t('failed'),'err')});
    }});
   }});
   c.querySelectorAll('[data-ced]').forEach(function(b){b.onclick=function(){catForm(managed.filter(function(x){return x.id===b.dataset.ced})[0],'categories')}});
   c.querySelectorAll('[data-cdel]').forEach(function(b){b.onclick=function(){
    var id=b.dataset.cdel;
    A.modal({title:A.t('del')+' — '+id,body:A.t('confirmDel'),danger:true,onConfirm:function(done){
     A.api('/admin/api/collection/categories/'+encodeURIComponent(id),{method:'DELETE'}).then(function(r){
      done();if(r._code===200){A.toast(A.t('updated'),'ok');setTimeout(function(){location.reload()},350)}else A.toast(r.error||A.t('failed'),'err');
     }).catch(function(){done();A.toast(A.t('errNet'),'err')});
    }});
   }});
   c.querySelectorAll('[data-rn]').forEach(function(b){
    b.onclick=function(){
     var from=b.dataset.rn;
     A.modal({
      title:(ar?'إعادة تسمية وسم':'Rename tag'),
      html:true,
      body:'<p class="small dim mb-3">'+(ar?'سيُستبدل «'+A.esc(from)+'» في '+tags[from].length+' عنصر.':'Replaces "'+A.esc(from)+'" across '+tags[from].length+' item(s).')+'</p><div class="field"><label for="rn-new">'+(ar?'الاسم الجديد':'New tag name')+'</label><input class="input" id="rn-new" value="'+A.esc(from)+'"></div>',
      onConfirm:function(done){
       var to=(document.getElementById('rn-new').value||'').trim();
       if(!to||to===from){done();return}
       A.api('/admin/api/content/rename-tag',{method:'POST',body:{from:from,to:to}}).then(function(r){
        done();if(r._code===200){A.toast(A.t('updated')+' ('+r.touched+')','ok');setTimeout(function(){location.reload()},350)}else A.toast(r.error||A.t('failed'),'err');
       }).catch(function(){done();A.toast(A.t('errNet'),'err')});
      }
     });
    };
   });
  }).catch(function(){c.innerHTML='<div class="empty"><h3>'+A.t('errNet')+'</h3></div>'});
 });
});
})();
</script>
</body>
</html>
