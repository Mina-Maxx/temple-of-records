<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المعبد — إعداد الفلاجات</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<script src="app.js"></script>
<script>
(function(){
var A=window.TORADMIN;
A.boot().then(function(ok){
 if(!ok)return;
 A.shell('flags','<b>'+A.t('nFlags')+'</b>',function(c){
  var ar=A.lang()==='ar';
  A.api('/admin/api/content').then(function(j){
   var items=j.collections.challenges||[];
   Promise.all([
    Promise.all(items.map(function(it){return A.api('/admin/api/challenges/'+encodeURIComponent(it.id)+'/flag')})),
    A.api('/admin/api/flag-policy')
   ]).then(function(rs){
    var flags=rs[0],pol=rs[1];
    c.innerHTML=
    '<div class="page-head"><div class="page-head-main"><h1>'+A.t('nFlags')+'</h1><span class="sub">'+(ar?'الفلاجات تُحفظ كهاشات على الخادم فقط (scrypt / SHA-256). النص الصريح لا يظهر هنا أبدًا.':'Flags live server-side only (scrypt / legacy SHA-256). Plaintext never leaves the server.')+'</span></div>'+
    '<div class="acts"><button type="button" class="btn primary" id="pol-save">'+A.icon('key',15)+(ar?'حفظ سياسة الصيغة':'Save policy')+'</button></div></div>'+
    '<div class="panel"><h2>'+(ar?'قواعد صيغة الفلاج العامة':'Global flag format policy')+'</h2><p class="sub">'+(ar?'تُطبَّق فور الحفظ بلا إعادة تشغيل. تعطيل حساسية الأحرف يطبّع الفلاجات المضبوطة لاحقًا.':'Applies immediately without restart. Case insensitivity normalizes flags set afterwards.')+'</p>'+
     '<div class="frow">'+
      '<div class="fcol"><label for="pol-case">'+(ar?'حساسية حالة الأحرف':'Case sensitivity')+'</label><select id="pol-case" class="input"><option value="1"'+(pol.case_sensitive?' selected':'')+'>'+(ar?'حساسة (TOR{...} ≠ tor{...})':'Case sensitive (TOR{...} ≠ tor{...})')+'</option><option value="0"'+(!pol.case_sensitive?' selected':'')+'>'+(ar?'غير حساسة':'Case insensitive')+'</option></select></div>'+
      '<div class="fcol"><label for="pol-fmt">'+(ar?'نمط الصيغة (regex اختياري)':'Format pattern (optional regex)')+'</label><input id="pol-fmt" class="input mono" dir="ltr" placeholder="^TOR\\{.+\\}$" value="'+A.esc(pol.format_hint||'')+'"></div>'+
     '</div></div>'+
    '<div class="tbl-wrap">'+(items.length?'<table class="tbl"><thead><tr><th scope="col">'+(ar?'التحدي':'Challenge')+'</th><th scope="col">'+(ar?'الحالة':'State')+'</th><th scope="col">'+(ar?'الخوارزمية والهاش':'Algorithm & digest')+'</th><th scope="col">'+(ar?'ضبط / استبدال':'Set / replace')+'</th></tr></thead><tbody>'+
     items.map(function(it,i){
      var f=flags[i]||{};
      var ttl=(ar&&A.arabicEnabled())?(it.title_ar||it.title_en||it.id):(it.title_en||(A.arabicEnabled()&&it.title_ar)||it.id);
      return '<tr><td><div class="t-main"><a href="challenge-edit.html?id='+encodeURIComponent(it.id)+'">'+A.esc(ttl)+'</a></div><div class="t-sub mono">'+A.esc(it.id)+'</div></td>'+
      '<td>'+(f.configured?A.badge(ar?'مضبوط':'Configured','ok'):A.badge(ar?'غير مضبوط':'Unset','warn'))+'</td>'+
      '<td>'+(f.sha256?'<span class="hash-pill" title="'+A.esc(f.sha256)+'">'+A.esc(f.sha256.slice(0,26))+'…</span>':'<span class="dim small">—</span>')+'</td>'+
      '<td><div class="inline-acts"><input class="input mono" dir="ltr" placeholder="TOR{…}" aria-label="'+A.esc(it.id)+'" data-fl="'+A.esc(it.id)+'"><button type="button" class="btn sm '+(f.configured?'danger':'primary')+'" data-set="'+A.esc(it.id)+'">'+(f.configured?(ar?'استبدال':'Replace'):(ar?'تعيين':'Set flag'))+'</button></div></td></tr>';
     }).join('')+'</tbody></table>'
     :'<div class="empty"><div class="ic">'+A.icon('key',22)+'</div><h3>'+A.t('empty')+'</h3></div>')+'</div>';

    c.querySelectorAll('[data-set]').forEach(function(b){
     b.onclick=function(){
      var id=b.dataset.set,v=c.querySelector('[data-fl="'+id+'"]').value.trim();
      if(!v)return;
      A.modal({title:ar?'تحديث الفلاج؟':'Update flag?',body:(ar?'سيُحفظ فلاج «'+id+'» بتجزئة scrypt فورًا (تبقى الحلول السابقة مسجلة).':'The flag for "'+id+'" will be hashed with scrypt and active immediately; prior solves stay intact.'),danger:true,onConfirm:function(done){
       A.api('/admin/api/challenges/'+encodeURIComponent(id)+'/flag',{method:'PUT',body:{flag:v,confirm_replace:true}}).then(function(r){
        done();if(r._code===200){A.toast(A.t('updated'),'ok');setTimeout(function(){location.reload()},400)}else A.toast(r.detail||r.error||A.t('failed'),'err');
       }).catch(function(){done();A.toast(A.t('errNet'),'err')});
      }});
     };
    });
    document.getElementById('pol-save').onclick=function(){
     A.api('/admin/api/flag-policy',{method:'PUT',body:{case_sensitive:document.getElementById('pol-case').value==='1',format_hint:document.getElementById('pol-fmt').value}}).then(function(r){
      if(r._code===200)A.toast(A.t('updated'),'ok');else A.toast(r.error||A.t('failed'),'err');
     }).catch(function(){A.toast(A.t('errNet'),'err')});
    };
   });
  }).catch(function(){c.innerHTML='<div class="empty"><h3>'+A.t('errNet')+'</h3></div>'});
 });
});
})();
</script>
</body>
</html>
