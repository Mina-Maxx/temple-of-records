<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المعبد — مكتبة الوسائط</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<script src="app.js"></script>
<script>
(function(){
var A=window.TORADMIN;
A.boot().then(function(ok){
 if(!ok)return;
 A.shell('media','<b>'+A.t('nMedia')+'</b>',function(c){
  var ar=A.lang()==='ar';
  var all=[],q='';
  function fmtB(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
  function paint(){
   var rows=all.filter(function(m){return !q||m.name.toLowerCase().indexOf(q)>=0});
   c.innerHTML='<div class="page-head"><div class="page-head-main"><h1>'+A.t('nMedia')+'</h1><span class="sub">'+(ar?'صور الصفحات المحفوظة في مجلد البيانات الدائم (TOR_DATA_DIR/assets) مع حماية الأصول المدمجة.':'Site media stored in persistent TOR_DATA_DIR/assets alongside read-only built-in assets.')+'</span></div>'+
   '<div class="acts"><button type="button" class="btn primary" id="up-btn">'+A.icon('img',15)+(ar?'رفع صورة':'Upload image')+'</button></div></div>'+
   '<div class="upzone" id="up" role="button" tabindex="0">'+A.icon('img',24)+'<div class="mt-2">'+(ar?'اسحب أو اضغط لرفع صورة (jpg · png · gif · webp — بحد أقصى 4MB)':'Click to upload an image (jpg · png · gif · webp — max 4 MB)')+'</div><input type="file" id="f" accept=".jpg,.jpeg,.png,.gif,.webp" hidden></div>'+
   '<div class="frow"><input class="input searchbar" id="q" type="search" aria-label="'+A.esc(A.t('search'))+'" placeholder="'+A.esc(A.t('search'))+'" value="'+A.esc(q)+'"><span class="count-pill">'+rows.length+' / '+all.length+'</span></div>'+
   '<div class="mgrid">'+(rows.length?rows.map(function(m){
    var statusBadge=m.overridden?A.badge(ar?'مستبدلة':'Overridden','warn'):(m.builtin?A.badge(ar?'مدمجة':'Built-in','dim'):A.badge(ar?'مرفوعة':'Uploaded','ok'));
    return '<div class="mcard"><div class="pv">'+(m.kind==='image'?'<img src="../assets/'+A.esc(m.name)+'" alt="'+A.esc(m.name)+'" loading="lazy">':A.icon('doc',26))+'</div>'+
    '<div class="meta"><div class="nm">'+A.esc(m.name)+'</div><div class="dt">'+fmtB(m.bytes)+' · '+A.fmtTs(m.mtime)+'</div><div class="mb-3">'+statusBadge+'</div>'+
    '<div class="acts"><button type="button" class="btn sm ghost" data-cp="'+A.esc(m.name)+'">'+(ar?'نسخ المسار':'Copy path')+'</button>'+
    (m.builtin&&!m.overridden?'':'<button type="button" class="btn sm danger" data-del="'+A.esc(m.name)+'">'+(m.overridden?(ar?'استعادة الأصل':'Restore original'):A.t('del'))+'</button>')+'</div></div></div>';
   }).join(''):'<div class="empty" style="grid-column:1/-1"><div class="ic">'+A.icon('img',22)+'</div><h3>'+A.t('empty')+'</h3></div>')+'</div>';

   document.getElementById('q').oninput=function(){q=this.value.toLowerCase();paint();var el=document.getElementById('q');el.focus();el.setSelectionRange(el.value.length,el.value.length)};
   var f=document.getElementById('f');
   var triggerUpload=function(){f.click()};
   document.getElementById('up-btn').onclick=triggerUpload;
   document.getElementById('up').onclick=triggerUpload;
   document.getElementById('up').onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();triggerUpload()}};
   f.onchange=function(){
    var file=f.files[0];if(!file)return;
    if(!f._decoded){var u=URL.createObjectURL(file),im=new Image();
     im.onload=function(){URL.revokeObjectURL(u);f._decoded=true;f.onchange()};
     im.onerror=function(){URL.revokeObjectURL(u);f.value='';A.toast(ar?'الملف ليس صورة صالحة: فشل فك الترميز في المتصفح':'Not a valid image: browser could not decode it','err')};
     im.src=u;return}
    f._decoded=false;
    var rd=new FileReader();
    rd.onload=function(){
     var b64=String(rd.result).split(',')[1];
     var zone=document.getElementById('up');
     var orig=zone.innerHTML;
     function prog(pct){zone.innerHTML='<div style="width:100%"><div class="small dim mb-3">'+(ar?'رفع ':'Uploading ')+A.esc(file.name)+' — '+pct+'%</div><div class="progress"><i style="width:'+pct+'%"></i></div></div>'}
     function done2(){zone.innerHTML=orig;var nf=document.getElementById('f');if(nf)f=nf;zone.onclick=triggerUpload}
     function xhrUpload(replaceFlag,cb){
      var x=new XMLHttpRequest();
      x.open('POST','/admin/api/media');
      x.setRequestHeader('Content-Type','application/json');
      x.upload.onprogress=function(e){if(e.lengthComputable)prog(Math.round(e.loaded/e.total*100))};
      x.onload=function(){var r={};try{r=JSON.parse(x.responseText)}catch(e){}r._code=x.status;cb(r)};
      x.onerror=function(){cb({_code:0,error:'network'})};
      var hdr=window.TORADMIN.csrf();
      if(hdr)x.setRequestHeader('x-csrf-token',hdr);
      x.send(JSON.stringify({name:file.name,data_b64:b64,replace:!!replaceFlag}));
     }
     prog(0);
     xhrUpload(false,function(r){
      if(r._code===200){done2();A.toast(A.t('created'),'ok');load()}
      else if(r._code===409&&r.error==='exists'){
       done2();
       A.modal({title:(ar?'استبدال ملف':'Replace file'),body:(ar?'«'+file.name+'» موجود بالفعل. استبداله؟':'"'+file.name+'" already exists. Replace it?'),danger:true,onConfirm:function(done){
        prog(0);
        xhrUpload(true,function(r2){done2();done();if(r2._code===200){A.toast(A.t('updated'),'ok');load()}else A.toast(r2.detail||r2.error||A.t('failed'),'err')});
       }});
      }
      else{done2();A.toast(r.detail||r.error||A.t('failed'),'err')}
     });
    };
    rd.readAsDataURL(file);
   };
   c.querySelectorAll('[data-cp]').forEach(function(b){b.onclick=function(){navigator.clipboard&&navigator.clipboard.writeText('assets/'+b.dataset.cp);A.toast('assets/'+b.dataset.cp,'ok')}});
   c.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){
    A.modal({title:A.t('del')+' — '+b.dataset.del,body:A.t('confirmDel'),danger:true,onConfirm:function(done){
     A.api('/admin/api/media/'+encodeURIComponent(b.dataset.del),{method:'DELETE'}).then(function(r){
      if(r._code===200){done();A.toast(A.t('updated'),'ok');load()}
      else if(r._code===409&&r.error==='referenced'){
       done();
       A.modal({title:(ar?'الملف مستخدم':'File in use'),body:(ar?'«'+b.dataset.del+'» مُشار إليه في: '+(r.refs||[]).join('، ')+'. الحذف قد يكسر المرجع. حذفه على أي حال؟':'"'+b.dataset.del+'" is referenced by: '+(r.refs||[]).join(', ')+'. Deleting may break references. Delete anyway?'),danger:true,onConfirm:function(d2){
        A.api('/admin/api/media/'+encodeURIComponent(b.dataset.del),{method:'DELETE',headers:{'x-force':'1'}}).then(function(r2){
         d2();if(r2._code===200){A.toast(A.t('updated'),'ok');load()}else A.toast(r2.error||A.t('failed'),'err');
        }).catch(function(){d2();A.toast(A.t('errNet'),'err')});
       }});
      }
      else{done();A.toast(r.error||A.t('failed'),'err')}
     }).catch(function(){done();A.toast(A.t('errNet'),'err')});
    }});
   }});
  }
  function load(){A.api('/admin/api/media').then(function(j){all=j.media||[];paint()}).catch(function(){c.innerHTML='<div class="empty"><h3>'+A.t('errNet')+'</h3></div>'})}
  load();
 });
});
})();
</script>
</body>
</html>
